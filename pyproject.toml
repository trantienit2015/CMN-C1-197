[project]
name = "cmn-c1-197"
version = "0.1.0"
description = "OWASP Agentic Top 10 Runtime Anomaly Alert Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the CI test job.
# pyyaml is a real runtime dependency: src/api/server.py imports it directly to
# read config/config.yaml and config/agent.yaml.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260518",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# stubs/ declares the fields of the framework's AgentState, so this template's State
# is checked as a TypedDict, NotRequired fields included.
mypy_path = "stubs"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# framework and shared are imported for their base classes and contracts; this project
# type-checks its own code, not theirs.
[[tool.mypy.overrides]]
module = ["framework", "framework.*", "shared.*"]
ignore_missing_imports = true

# Nodes, graphs and service clients here derive from framework base classes.
[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false
