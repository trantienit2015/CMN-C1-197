# Agent Manifest — AgentRegistry entry point.
# Every key below is read at ROOT level; nesting them under an `agent:` block makes
# them invisible to the registry (namespace/enabled fall back to defaults and
# name/version never resolve). Runtime parameters live in config/config.yaml.
id: "CMN-C1-197"
name: "OWASPAnomalyAlertAgent"
# Registry key component: {namespace}/{name}@{version} — the industry code, lowercased.
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 1"
industry: "CMN"
# Static generation contract of the deployed agent.
# "llm" since 2026-09-11: the Step 2 classifier now has an optional LLM
# enhancement (src/services/llm_classify_service.py) alongside its
# deterministic rule-table floor. See docs/02_design.md §3.
generation_mode: "llm"  # deterministic | llm
# Compatibility metadata only — not an inheritance selector.
base_type: "DocGenerationAgent"

# Entry point — one dotted import path (module.Class); the registry splits it on the
# last dot, so a separate module:/class: pair never resolves.
class: "src.graph.graph.OWASPAnomalyAlertAgent"

# S-1 trust gate declared for the deployment. Per-node enforcement stays in the node
# classes; this value does not replace it.
required_trust_level: "INTERNAL"

# Compile-time gates — every secret and extra actually used must be declared.
# The three AZURE_OPENAI_* secrets back the OPTIONAL Step 2 LLM enhancement
# (src/services/llm_classify_service.py); any missing at runtime degrades
# silently to the deterministic rule-table classifier, never a compile error
# (require_at_compile is not called for these — see docs/02_design.md §3).
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]
